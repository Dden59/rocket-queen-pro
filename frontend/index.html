<!DOCTYPE html>
<html>
<head>
    <title>Rocket Queen Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="gold-text">🚀 ROCKET QUEEN PRO</h1>
        <div id="rocket" class="rocket"></div>
        
        <div class="panel">
            <p>Ваш уровень: <span id="level">🪐 Новичок</span></p>
            <p>Баланс: <span id="balance">5000</span>₽</p>
            
            <div class="btn-group">
                <button id="win-btn" class="btn win">ВЫИГРАЛ</button>
                <button id="lose-btn" class="btn lose">ПРОИГРАЛ</button>
            </div>
            
            <div id="result" class="hidden">
                <p>Новая ставка: <span id="next-bet">100</span>₽</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
